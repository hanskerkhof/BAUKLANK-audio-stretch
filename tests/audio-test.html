<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BAUKLANK Audio Test</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #1b1f27;
      --text: #f2f5f9;
      --muted: #adb8c8;
      --ok: #7be495;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background: radial-gradient(circle at 20% 20%, #20293a, var(--bg));
      color: var(--text);
    }
    main {
      width: min(92vw, 760px);
      background: var(--panel);
      border: 1px solid #2f3848;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }
    h1 { margin: 0 0 8px; font-size: 1.8rem; }
    p { margin: 0 0 16px; color: var(--muted); }
    .status { margin-bottom: 14px; color: var(--ok); min-height: 1.2em; }
    audio { width: 100%; margin-top: 8px; }
    .hint { margin-top: 14px; font-size: 0.9rem; }
    button {
      margin-top: 14px;
      border: 1px solid #4a576f;
      background: #2a3446;
      color: var(--text);
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>BAUKLANK Audio Test</h1>
    <p>If you hear speech/music, Chromium audio output is working on this machine.</p>
    <div class="status" id="status">Trying autoplay...</div>
    <audio id="player" controls autoplay loop>
      <source src="00001 - you-should-be-hearing-this.mp3" type="audio/mpeg">
      Your browser does not support HTML audio.
    </audio>
    <div class="hint">If autoplay fails, click Play below.</div>
    <button id="playBtn" type="button">Play Audio</button>
  </main>

  <script>
    const player = document.getElementById('player');
    const status = document.getElementById('status');
    const playBtn = document.getElementById('playBtn');

    async function tryPlay() {
      try {
        await player.play();
        status.textContent = 'Playback active.';
      } catch (err) {
        status.textContent = 'Autoplay blocked. Use Play button.';
      }
    }

    playBtn.addEventListener('click', () => {
      player.play().then(() => {
        status.textContent = 'Playback active.';
      }).catch(() => {
        status.textContent = 'Still blocked. Check output device and volume.';
      });
    });

    tryPlay();
  </script>
</body>
</html>
